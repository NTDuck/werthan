name: CD

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Space-separated list of binary target names to exclude from release (e.g. "mybin helper")
  EXCLUDE_BINARIES: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64.tar.gz
          - os: macos-latest
            suffix: macos-universal.tar.gz
          - os: windows-latest
            suffix: windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Package binaries (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          BINARIES=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name')
          for bin in $BINARIES; do
            if echo "$EXCLUDE_BINARIES" | grep -qw "$bin"; then
              echo "Skipping excluded binary: $bin"
              continue
            fi
            src="target/release/$bin"
            if [ -f "$src" ]; then
              tar -czf "dist/${bin}-${{ matrix.suffix }}" -C target/release "$bin"
            fi
          done

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $excludes = $env:EXCLUDE_BINARIES -split '\s+'
          foreach ($pkg in $metadata.packages) {
            foreach ($tgt in $pkg.targets) {
              if ($tgt.kind -contains "bin") {
                $bin = $tgt.name
                if ($excludes -contains $bin) {
                  Write-Host "Skipping excluded binary: $bin"
                  continue
                }
                $src = "target/release/$bin.exe"
                if (Test-Path $src) {
                  Compress-Archive -Path $src -DestinationPath "dist/${bin}-${{ matrix.suffix }}"
                }
              }
            }
          }

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*
          if-no-files-found: ignore

  release:
    needs:
      - build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release with release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
