campaign_id: skel-heapq-bench
execution_mode: full_auto
paths:
  input_legacy_dir: benchmarks/assets/ReCodeAgent/data/tool_projects/skel/heapq/python
  workspace_root: benchmarks/outputs/skel/heapq/javascript
  off_limits_globs: []
stack:
  source_language: python
  binary_artifacts: []
  use_ghidra_rea: false
  target_language: javascript
  target_edition_or_framework: '2024'
  target_build_cmd: node -c translated.js
  target_test_cmd: node translated.js
  legacy_test_harness_cmd: pytest
inference:
  base_url: ''
  model: swift-1.5-qwen3.8-27b
  max_parallel_shards: 2
  max_shards: 2
  inference_max_tokens: 32768
  inference_temperature: 0.2
  inference_timeout_secs: 900
  build_timeout_secs: 120
  test_timeout_secs: 120
verification:
  max_self_heal_retries: 3
  require_byte_identical_io: false
ariadne:
  max_rollouts: 16
