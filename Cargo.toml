[workspace]
members = [
    "werðan/.checks/*",
    "werðan/.examples/*",
    "werðan/protocol",
    "werðan/harness",
    "werðan/verify",
    "werðan/orchestrator",
    "werðan/bins/daemon",
    "werðan/bins/interactive",
    "werðan/blackboard",
    "werðan/infras/topology",
    "werðan/infras/state-machine",
    "werðan/middleware/laya",
    "werðan/middleware/tools/REA",
]
exclude = [
    "benchmarks",
    "workspace",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/NTDuck/werthan"
publish = false

[workspace.dependencies]
# Cross-cutting concerns, centralized
flatmods = { path = "werðan/.checks/flatmods" }
pathqual = { path = "werðan/.checks/pathqual" }
plumbing = { path = "werðan/.checks/plumbing" }
ste100 = { path = "werðan/.checks/ste100" }
stepdown = { path = "werðan/.checks/stepdown" }
turbofish = { path = "werðan/.checks/turbofish" }

# Crates in workspace
protocol = { path = "werðan/protocol" }
harness = { path = "werðan/harness" }
orchestrator = { path = "werðan/orchestrator" }
verify = { path = "werðan/verify" }
blackboard = { path = "werðan/blackboard" }
topology = { path = "werðan/infras/topology" }
state-machine = { path = "werðan/infras/state-machine" }
laya = { path = "werðan/middleware/laya" }
jev = { path = "werðan/middleware/laya", package = "laya" }
rea = { path = "werðan/middleware/tools/REA" }
daemon = { path = "werðan/bins/daemon" }
interactive = { path = "werðan/bins/interactive" }
# Crates that we choose to marry
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
bon = "3"
serde_json = "1.0"
serde_yaml_ng = "0.10"
tokio = { version = "1.40", features = ["full"] }
schemars = "0.8"
sha2 = "0.10"
similar = "2.6"
quick-xml = "0.36"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = { version = "0.29", features = ["serde"] }
crossterm = "0.28"
rig-core = { version = "0.9", default-features = false }
[workspace.lints.rust]
# See: https://doc.rust-lang.org/rustc/lints/listing/index.html

[workspace.lints.clippy]
# See: https://rust-lang.github.io/rust-clippy/master/index.html
missing_safety_doc = "allow"
let_and_return = "allow"
too_many_arguments = "allow"

[workspace.metadata.rust-analyzer]
# See: https://rust-analyzer.github.io/book/diagnostics.html
