[workspace]
members = [
    "werðan/.checks/*",
    "werðan/.examples/*",
    "werðan/infras/core",
    "werðan/infras/blackboard",
    "werðan/infras/statechart",
    "werðan/infras/laya",
    "werðan/infras/tools/mcp",
    "werðan/infras/tools/rea",
    "werðan/topology/operative",
    "werðan/topology/cluster",
    "werðan/topology/daedalus",
    "werðan/bins/daemon",
    "werðan/bins/interactive",
]
exclude = [
    "benchmarks",
    "workspace",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/NTDuck/werthan"
publish = false

[workspace.dependencies]
# Cross-cutting concerns, centralized
flatmods = { path = "werðan/.checks/flatmods" }
pathqual = { path = "werðan/.checks/pathqual" }
plumbing = { path = "werðan/.checks/plumbing" }
ste100 = { path = "werðan/.checks/ste100" }
stepdown = { path = "werðan/.checks/stepdown" }
turbofish = { path = "werðan/.checks/turbofish" }

# Infras
protocol = { path = "werðan/infras/core" }
blackboard = { path = "werðan/infras/blackboard" }
statechart = { path = "werðan/infras/statechart" }
laya = { path = "werðan/infras/laya" }
mcp = { path = "werðan/infras/tools/mcp" }
rea = { path = "werðan/infras/tools/rea" }

# Topology
operative = { path = "werðan/topology/operative" }
cluster = { path = "werðan/topology/cluster" }
daedalus = { path = "werðan/topology/daedalus" }

# Bins
daemon = { path = "werðan/bins/daemon" }
interactive = { path = "werðan/bins/interactive" }

# External Crates
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_yaml_ng = { version = "0.10" }
tokio = { version = "1.40", features = ["full"] }
schemars = { version = "0.8" }
sha2 = { version = "0.10" }
similar = { version = "2.6" }
quick-xml = { version = "0.36" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28" }
rig-core = { version = "0.9", default-features = false }
bon = { version = "3.3" }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }

[workspace.lints.rust]
missing_docs = "allow"

[workspace.lints.clippy]
missing_safety_doc = "allow"
let_and_return = "allow"
too_many_arguments = "allow"

[workspace.metadata.rust-analyzer]
diagnostics.disabled = [
    "unresolved-proc-macro",
]
