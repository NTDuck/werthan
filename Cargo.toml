[workspace]
members = [
    "werðan/.checks/*",
    "werðan/.examples/*",
    "werðan/bridges/*",
    "werðan/bins/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/NTDuck/werthan"
publish = false

[workspace.dependencies]
# Cross-cutting concerns, centralized
flatmods = { path = "werðan/.checks/flatmods" }
pathqual = { path = "werðan/.checks/pathqual" }
plumbing = { path = "werðan/.checks/plumbing" }
ste100 = { path = "werðan/.checks/ste100" }
stepdown = { path = "werðan/.checks/stepdown" }
turbofish = { path = "werðan/.checks/turbofish" }

# Crates that we choose to marry
# See: https://blessed.rs/crates
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
bon = "3"
cucumber = "0.21.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-stream = "0.1"
rig = { version = "0.44.0", features = ["agent", "derive", "reqwest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }

[workspace.lints.rust]
# See: https://doc.rust-lang.org/rustc/lints/listing/index.html

[workspace.lints.clippy]
# See: https://rust-lang.github.io/rust-clippy/master/index.html
missing_safety_doc = "allow"
let_and_return = "allow"

[workspace.metadata.rust-analyzer]
# See: https://rust-analyzer.github.io/book/diagnostics.html
